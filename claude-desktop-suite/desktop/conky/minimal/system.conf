-- Conky Minimal - System Overview Widget
-- Optimized for HiDPI (4096x2560) with 100% transparency

local f = io.open("/proc/net/route", "r")
local iface = "wlp0s20f3"
if f then
  for line in f:lines() do
    local dev, dest = line:match("^(%S+)%s+(%S+)")
    if dest == "00000000" then
      iface = dev
      break
    end
  end
  f:close()
end

local is_wifi = iface:sub(1, 2) == "wl"

conky.config = {
  alignment = 'top_right',
  gap_x = 70,
  gap_y = 110,
  maximum_width = 700,
  minimum_width = 700,
  use_xft = true,
  override_utf8_locale = true,
  font = 'Ubuntu:pixelsize=26',
  
  -- Minimalist Colors
  default_color = 'FAF9F5',
  color1 = 'D97757', -- Claude terracotta
  color2 = 'B0AEA5', -- Warm gray
  color3 = 'A7B68D', -- Soft olive
  
  -- Full Transparency
  background = false,
  border_width = 0,
  draw_borders = false,
  draw_graph_borders = false,
  draw_outline = false,
  draw_shades = false,
  own_window = true,
  own_window_colour = '000000',
  own_window_class = 'Conky',
  own_window_title = 'ClaudeDesktop-System',
  own_window_argb_visual = true,
  own_window_type = 'desktop',
  own_window_transparent = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  
  double_buffer = true,
  update_interval = 1,
  cpu_avg_samples = 2,
  net_avg_samples = 2,
}

local net_title = ""
if is_wifi then
  net_title = "${color1}${font Ubuntu:bold:pixelsize=30}NETWORK${font}${color}  ${font Ubuntu:medium:pixelsize=24}Wi-Fi (" .. iface .. ")${alignr}${color2}${font Ubuntu:pixelsize=24}${wireless_essid " .. iface .. "} (${wireless_link_qual_perc " .. iface .. "}%)"
else
  net_title = "${color1}${font Ubuntu:bold:pixelsize=30}NETWORK${font}${color}  ${font Ubuntu:medium:pixelsize=24}Ethernet (" .. iface .. ")"
end

conky.text = [[
${color1}${font Ubuntu:bold:pixelsize=38}SYSTEM OVERVIEW${font}${alignr}${color2}${font Ubuntu:medium:pixelsize=26}${time %H:%M}${font}
${color 655F56}${hr 2}${color}
${voffset 14}\
${color1}${font Ubuntu:bold:pixelsize=30}CPU${font}${color}  ${font Ubuntu:medium:pixelsize=24}Processor${font}
${voffset 8}\
${color2}${font Ubuntu:pixelsize=25}Usage: ${color}${font Ubuntu:bold:pixelsize=26}${cpu cpu0}%${font}${alignr}${color2}${font Ubuntu:pixelsize=25}Temp: ${color}${font Ubuntu:medium:pixelsize=25}${execi 2 cat /dev/shm/conky_minimal/cpu_temp}°C  ${color2}${freq_g} GHz${font}
${voffset 8}\
${color1}${cpubar 12,700}${color}
${voffset 14}\
${color1}${font Ubuntu:bold:pixelsize=30}GPU${font}${color}  ${font Ubuntu:medium:pixelsize=24}NVIDIA GPU${font}
${voffset 8}\
${color2}${font Ubuntu:pixelsize=25}Load: ${color}${font Ubuntu:bold:pixelsize=26}${execi 2 cat /dev/shm/conky_minimal/gpu_util}%${font}${alignr}${color2}${font Ubuntu:pixelsize=25}Temp: ${color}${font Ubuntu:medium:pixelsize=25}${execi 2 cat /dev/shm/conky_minimal/gpu_temp}°C${font}
${voffset 8}\
${color2}${font Ubuntu:pixelsize=25}VRAM: ${color}${execi 2 cat /dev/shm/conky_minimal/vram_used} / ${execi 2 cat /dev/shm/conky_minimal/vram_total} MB${alignr}${color2}${execi 2 cat /dev/shm/conky_minimal/vram_pct}%${font}
${voffset 8}\
${color1}${execbar 12,700 cat /dev/shm/conky_minimal/vram_pct}${color}
${voffset 14}\
${color1}${font Ubuntu:bold:pixelsize=30}MEMORY${font}${color2}${alignr}${font Ubuntu:pixelsize=25}${mem} / ${memmax} (${memperc}%)${font}
${voffset 8}\
${color1}${membar 12,700}${color}
${voffset 14}\
${color1}${font Ubuntu:bold:pixelsize=30}STORAGE${font}
${voffset 8}\
${color2}${font Ubuntu:pixelsize=24}System (/): ${color}${fs_used /} / ${fs_size /}${alignr}${color2}${fs_used_perc /}%${font}
${voffset 6}\
${color1}${fs_bar 10,700 /}${color}
${voffset 10}\
${color2}${font Ubuntu:pixelsize=24}Data (NVMe): ${color}${fs_used @DATA_MOUNT@} / ${fs_size @DATA_MOUNT@}${alignr}${color2}${fs_used_perc @DATA_MOUNT@}%${font}
${voffset 6}\
${color1}${fs_bar 10,700 @DATA_MOUNT@}${color}
${voffset 14}\
]] .. net_title .. [[${font}
${voffset 8}\
${color2}${font Ubuntu:pixelsize=25}DL: ${color3}${font Ubuntu:bold:pixelsize=26}${downspeed ]] .. iface .. [[}${font}  ${color2}${font Ubuntu:pixelsize=25}UL: ${color1}${font Ubuntu:bold:pixelsize=26}${upspeed ]] .. iface .. [[}${font}${alignr}${color2}${font Ubuntu:pixelsize=23}Total: ${color}${totaldown ]] .. iface .. [[} / ${totalup ]] .. iface .. [[}${font}
${voffset 16}
]]
