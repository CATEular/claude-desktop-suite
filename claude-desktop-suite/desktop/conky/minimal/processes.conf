-- Conky Minimal - Top Processes Widget
-- Optimized for HiDPI (4096x2560) with 100% transparency

conky.config = {
  alignment = 'top_right',
  gap_x = 70,
  gap_y = 915,
  maximum_width = 700,
  minimum_width = 700,
  use_xft = true,
  override_utf8_locale = true,
  font = 'Ubuntu:pixelsize=24',
  
  -- Minimalist Colors
  default_color = 'FAF9F5',
  color1 = 'D97757', -- Claude terracotta
  color2 = 'B0AEA5', -- Warm gray
  color3 = 'A7B68D', -- Soft olive
  
  -- Full Transparency
  background = false,
  border_width = 0,
  draw_borders = false,
  draw_graph_borders = false,
  draw_outline = false,
  draw_shades = false,
  own_window = true,
  own_window_colour = '000000',
  own_window_class = 'Conky',
  own_window_title = 'ClaudeDesktop-Processes',
  own_window_argb_visual = true,
  own_window_type = 'desktop',
  own_window_transparent = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  
  double_buffer = true,
  update_interval = 2,
}

conky.text = [[
${color1}${font Ubuntu:bold:pixelsize=38}TOP PROCESSES${font}${alignr}${color2}${font Ubuntu:medium:pixelsize=24}ACTIVE TASKS${font}
${color 655F56}${hr 2}${color}
${voffset 12}\
${color2}${font Ubuntu:bold:pixelsize=25}CPU PROCESS${goto 460}CPU%${alignr}MEM${font}
${color 49453F}${hr 1}${color}
${voffset 6}\
${color}${font Ubuntu:pixelsize=24}${top name 1}${goto 460}${top cpu 1}%${alignr}${top mem_res 1}
${voffset 8}\
${color}${font Ubuntu:pixelsize=24}${top name 2}${goto 460}${top cpu 2}%${alignr}${top mem_res 2}
${voffset 8}\
${color}${font Ubuntu:pixelsize=24}${top name 3}${goto 460}${top cpu 3}%${alignr}${top mem_res 3}
${voffset 8}\
${color}${font Ubuntu:pixelsize=24}${top name 4}${goto 460}${top cpu 4}%${alignr}${top mem_res 4}
${voffset 8}\
${color}${font Ubuntu:pixelsize=24}${top name 5}${goto 460}${top cpu 5}%${alignr}${top mem_res 5}
${voffset 14}\
${color 655F56}${hr 2}${color}
${voffset 12}\
${color2}${font Ubuntu:bold:pixelsize=25}GPU PROCESS${goto 460}GPU%${alignr}VRAM${font}
${color 49453F}${hr 1}${color}
${voffset 6}\
${color}${font Ubuntu:pixelsize=24}${execi 2 cat /dev/shm/conky_minimal/gpu_p1_name}${goto 460}${execi 2 cat /dev/shm/conky_minimal/gpu_p1_sm}${alignr}${execi 2 cat /dev/shm/conky_minimal/gpu_p1_vram}
${voffset 8}\
${color}${font Ubuntu:pixelsize=24}${execi 2 cat /dev/shm/conky_minimal/gpu_p2_name}${goto 460}${execi 2 cat /dev/shm/conky_minimal/gpu_p2_sm}${alignr}${execi 2 cat /dev/shm/conky_minimal/gpu_p2_vram}
${voffset 8}\
${color}${font Ubuntu:pixelsize=24}${execi 2 cat /dev/shm/conky_minimal/gpu_p3_name}${goto 460}${execi 2 cat /dev/shm/conky_minimal/gpu_p3_sm}${alignr}${execi 2 cat /dev/shm/conky_minimal/gpu_p3_vram}
${voffset 8}\
${color}${font Ubuntu:pixelsize=24}${execi 2 cat /dev/shm/conky_minimal/gpu_p4_name}${goto 460}${execi 2 cat /dev/shm/conky_minimal/gpu_p4_sm}${alignr}${execi 2 cat /dev/shm/conky_minimal/gpu_p4_vram}
${voffset 8}\
${color}${font Ubuntu:pixelsize=24}${execi 2 cat /dev/shm/conky_minimal/gpu_p5_name}${goto 460}${execi 2 cat /dev/shm/conky_minimal/gpu_p5_sm}${alignr}${execi 2 cat /dev/shm/conky_minimal/gpu_p5_vram}
${voffset 16}
]]
